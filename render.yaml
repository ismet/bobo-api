services:
  - type: web
    name: epias-data-provider
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EPTR_USERNAME
        sync: false
      - key: EPTR_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
