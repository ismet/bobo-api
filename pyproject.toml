[project]
name = "epias-data-provider"
version = "0.2.0"
description = "Minimal FastAPI wrapper around eptr2 for EPİAŞ transparency data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "eptr2>=1.3.7",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: calls real EPİAŞ via eptr2 (requires .env credentials)",
]
